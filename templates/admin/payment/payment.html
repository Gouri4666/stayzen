<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Gateway</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f9f9f9;
        }

        #pay-btn {
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #pay-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Payment Gateway</h1>
    <p><strong>Amount:</strong> ₹{{ amount }}</p>
    <p><strong>Name:</strong> {{ name }}</p>

    <button id="pay-btn">Pay Now</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    var options = {
        key: "#",
        amount: Math.min(parseFloat("{{ payment_details.amount }}") || 0, 50000) * 100,
        currency: "INR",
        name: "StayZen",
        description: "Payment",

        handler: function (response) {
            alert("Payment Successful!\nPayment ID: " + response.razorpay_payment_id);

            // Redirect after successful payment
            window.location.href = "{% url 'dashboard' %}";
        },

        theme: {
            color: "#28a745"
        }
    };

    var rzp = new Razorpay(options);

    document.getElementById("pay-btn").onclick = function (e) {
        rzp.open();
        e.preventDefault();
    };
</script>

</body>
</html>
