{% extends 'admin/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="card border-0 shadow-lg">
        <div class="card-header bg-warning text-white d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0">Edit Session</h4>
                <small>{{ activity.activity_name }}</small>
            </div>
            <a href="{% url 'edit_activity' activity.id %}" class="btn btn-light btn-sm">Back to Activity</a>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Start Time</label>
                        {{ form.start_time }}
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">End Time</label>
                        {{ form.end_time }}
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Capacity</label>
                        {{ form.capacity }}
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        {{ form.status }}
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-warning text-white">Update Session</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
